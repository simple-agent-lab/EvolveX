[project]
name = "evolve-framework"
version = "0.1.0"
description = "Mechanism CLI for file-based agent evolution workspaces."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "harbor==0.18.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.scripts]
evolve = "evolve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pragmatic set: pyflakes (F), pycodestyle (E/W), import order (I),
# pyupgrade (UP), flake8-bugbear (B). Keep the harness honest without a
# reformat crusade.
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by the formatter target, not enforced hard
    "B008",   # function calls in argument defaults — Typer's Argument/Option idiom
    "UP031",  # printf-style % formatting is pervasive & intentional here (tighten later)
    "B904",   # explicit exception chaining — nice-to-have, not enforced yet (tighten later)
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures from conftest by name and re-bind freely.
"tests/**" = ["E402", "B011"]

[tool.ty.src]
include = ["src/evolve"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolve", "library"]

[tool.hatch.build.targets.wheel.force-include]
"library" = "evolve/library"
"recipes" = "evolve/recipes"
"templates" = "evolve/templates"
"skills" = "evolve/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "8", "--dist", "worksteal"]
