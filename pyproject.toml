[project]
name = "evolve-framework"
version = "0.1.0"
description = "File-based framework for evolving coding agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Simple Agent Lab" }]
requires-python = ">=3.12"
keywords = ["agents", "ai", "evaluation", "experimentation", "self-improvement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "harbor==0.18.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/simple-agent-lab/simple-evolve-agent"
Documentation = "https://github.com/simple-agent-lab/simple-evolve-agent#documentation"
Repository = "https://github.com/simple-agent-lab/simple-evolve-agent"
Issues = "https://github.com/simple-agent-lab/simple-evolve-agent/issues"

[project.scripts]
evolve = "evolve.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pragmatic set: pyflakes (F), pycodestyle (E/W), import order (I),
# pyupgrade (UP), flake8-bugbear (B). Keep the harness honest without a
# reformat crusade.
select = ["F", "E", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by the formatter target, not enforced hard
    "B008",   # function calls in argument defaults — Typer's Argument/Option idiom
    "UP031",  # printf-style % formatting is pervasive & intentional here (tighten later)
    "B904",   # explicit exception chaining — nice-to-have, not enforced yet (tighten later)
]

[tool.ruff.lint.per-file-ignores]
# Tests import fixtures from conftest by name and re-bind freely.
"tests/**" = ["E402", "B011"]

[tool.ty.src]
include = ["src/evolve"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Bundle the operator catalog under `evolve/library`; avoid a duplicate top-level `library` package.
packages = ["src/evolve"]

[tool.hatch.build.targets.wheel.force-include]
"library" = "evolve/library"
"recipes" = "evolve/recipes"
"scaffolds" = "evolve/scaffolds"
"seeds" = "evolve/seeds"
"skills" = "evolve/skills"
"containers" = "evolve/containers"
"LICENSE" = "evolve/licenses/LICENSE"
"NOTICE" = "evolve/licenses/NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-n", "8", "--dist", "worksteal"]
markers = [
    "slow: expensive integration or end-to-end test; skipped unless --run-slow is passed",
]
