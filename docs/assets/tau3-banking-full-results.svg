<title id="title">Tau³ Banking · Full-Benchmark Results</title>
<desc id="desc">Four evolution methods × two target agents · GPT-5.4-high target, GPT-5.4-xhigh Codex meta-agent MiniSWE results are grouped on the left and Codex results on the right. Each continuous stacked bar shows the seed score in its dark section and the improvement to the best score in its light section. Labels give the seed score, best score, and improvement.</desc>
