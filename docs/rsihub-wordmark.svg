<svg xmlns="http://www.w3.org/2000/svg" width="92" height="44" viewBox="0 0 92 44" role="img" aria-labelledby="wordmark-title wordmark-description">
  <title id="wordmark-title">RSIHub</title>
  <desc id="wordmark-description">RSI in interface ink followed by Hub in a blue-to-green ramp.</desc>
  <style>
    .wordmark {
      fill: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.54px;
    }
    .hub {
      fill: url(#hub-ramp);
      font-style: normal;
    }
    .ramp-third { stop-color: #00a3b0; }
    .ramp-fourth { stop-color: #2fa844; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #e6edf3; }
      .ramp-third { stop-color: #00cbd4; }
      .ramp-fourth { stop-color: #78e85c; }
    }
  </style>
  <defs>
    <linearGradient id="hub-ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c8cff"/>
      <stop offset="0.32" stop-color="#0095fd"/>
      <stop class="ramp-third" offset="0.66" stop-color="#00a3b0"/>
      <stop class="ramp-fourth" offset="1" stop-color="#2fa844"/>
    </linearGradient>
  </defs>
  <text class="wordmark" x="0" y="32">RSI<tspan class="hub">Hub</tspan></text>
</svg>
