name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Configure clean uv cache
        id: configure-uv-cache
        run: echo "UV_CACHE_DIR=$RUNNER_TEMP/evolve-clean-uv-cache" >> "$GITHUB_ENV"

      - name: Install Python 3.12
        id: install-python-312
        run: uv python install 3.12

      - name: Reset uv cache for hermetic probe
        id: reset-uv-cache
        run: rm -rf "$UV_CACHE_DIR"

      - name: Warm root Python 3.12 runtime
        id: warm-root-runtime
        run: uv sync --dev --python 3.12

      - name: Warm scaffold Python 3.12 runtime
        id: warm-scaffold-runtime
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/evolve-scaffold-venv
        run: uv sync --project scaffolds/workspace --frozen --no-install-project --python 3.12

      - name: Check scaffold lock offline
        id: check-scaffold-lock
         env:
           UV_OFFLINE: "1"
         run: uv lock --project scaffolds/workspace --check --offline

      - name: Probe generated workspaces offline
        id: offline-workspace-probe
        env:
          UV_OFFLINE: "1"
        run: uv run --offline pytest -q tests/test_recipe_composition.py

      # Safety net: workspaces set their own per-repo git identity, but a bare CI
      # runner has no global one — configure it so any stray git op still works.
      - name: Configure git identity
        run: |
          git config --global user.name "evolve-ci"
          git config --global user.email "evolve-ci@example.invalid"
          git config --global init.defaultBranch main

      # The suite is the coherence guard (ARCHITECTURE + line budgets + the
      # operator registry single-source are all enforced here). It must pass on
      # every PR — this is what keeps an agent/human-built codebase from rotting.
      - name: pytest
        run: uv run pytest -q

      - name: self-driving smoke (init → run → verify)
        env:
          EVOLVE_RUNTIME_DIGEST: sha256:ci-smoke-runtime
        run: |
          rm -rf "$RUNNER_TEMP/ci-smoke" "$RUNNER_TEMP/ci-smoke-home"
          uv run evolve init "$RUNNER_TEMP/ci-smoke" --recipe hill_climb
          EVAL_STUB=1 EVOLVE_HOME="$RUNNER_TEMP/ci-smoke-home" "$RUNNER_TEMP/ci-smoke/evolve" run "$RUNNER_TEMP/ci-smoke" --max-generations 3
          EVOLVE_HOME="$RUNNER_TEMP/ci-smoke-home" "$RUNNER_TEMP/ci-smoke/evolve" verify "$RUNNER_TEMP/ci-smoke"
