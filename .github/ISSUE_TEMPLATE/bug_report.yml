name: Bug report
description: Report a reproducible Evolve Framework defect.
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes: {label: Problem summary}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Evolve commit or version}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and uv version.
    validations: {required: true}
  - type: input
    id: recipe
    attributes: {label: Recipe}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Reproduction commands, render: shell}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove credentials, tokens, proxy passwords, and private data.
      render: text
