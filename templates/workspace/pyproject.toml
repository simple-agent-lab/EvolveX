[project]
name = "evolve-workspace-runtime"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.18.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolve_harbor_adapter"]
