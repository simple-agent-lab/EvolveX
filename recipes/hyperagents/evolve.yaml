experiment:
  id: hyperagents
  max_generations: 8
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: https://github.com/SWE-agent/mini-swe-agent.git
  harbor_agent: miniswe-source
surface:
  include:
    - target/**
    - operators/**
  exclude: []
operators:
  select: {variant: score_child_prop, seed: 0}
  rollout: {variant: harbor, model: openai/gpt-5.4, budget_tasks: 32, n_concurrent: 16, agent_setup_timeout_multiplier: 3, max_retries: 1, timeout_s: 3600}
  trace_analyzer: {variant: trace_browser, max_chars: 30000, timeout_s: 600}
  meta_agent: {variant: hyperagents, runner: harbor, agent: mini-swe-agent, model: openai/gpt-5.4, environment: docker, image: evolve-meta-agent-app:ubuntu-latest, editable_roots: [target, operators], max_retries: 0, timeout_s: 21600}
  validate: {variant: hyperagents, timeout_s: 300}
  gate: {variant: parent_eligible}
  record: {variant: hyperagents}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: swe-bench-lite
  agent: evolve_harbor_adapter:MiniSweSourceAgent
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 16
  k: 1
  n_concurrent: 16
  partial_floor: 0.8
