experiment:
  id: hyperagents
  max_generations: 10
  target_score: null
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: https://github.com/SWE-agent/mini-swe-agent.git
  harbor_agent: miniswe-source
surface:
  include:
    - target/**
    - operators/**
  exclude: []
operators:
  select: {variant: score_child_prop, seed: 0}
  rollout: {variant: evaluation_replay, field_limit: 2000, timeout_s: 600}
  trace_analyzer: {variant: trace_browser, max_chars: 30000, timeout_s: 600}
  meta_agent: {variant: hyperagents, runner: harbor, agent: evolve_harbor_agent:FileTaskMiniSweAgent, model: openai/gpt-5.4-2026-03-05, environment: docker, image: evolve-meta-agent-app:ubuntu-latest, editable_roots: [target, operators], max_retries: 2, timeout_s: 21600}
  validate: {variant: hyperagents, timeout_s: 300}
  gate: {variant: parent_eligible}
  record: {variant: hyperagents}
  timeout_s: 600
evaluator:
  engine: harbor
  model: openai/gpt-5.4-2026-03-05
  candidate_runtime: {variant: uv, project: target, python: "3.12"}
  dataset: terminal-bench@2.0
  agent: evolve_harbor_adapter:MiniSweSourceAgent
  task_scope: full
  evaluation_split: train
  sampling: static
  tasks_per_round: 89
  k: 1
  n_concurrent: 4
  max_retries: 1
  benchmark_timeout_is_zero: true
  partial_floor: 0.8
