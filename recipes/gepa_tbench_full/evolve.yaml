experiment:
  id: gepa-tbench-full
  max_generations: 10
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
  harbor_agent: miniswe-source
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {variant: pareto, seed: 0, timeout_s: 600}
  rollout:
    variant: harbor
    budget_tasks: 50
    task_sampling: generation_shuffle
    n_concurrent: 25
    agent_setup_timeout_multiplier: 1
    agent_timeout_multiplier: 1
    max_retries: 1
    timeout_s: 43200
  trace_analyzer:
    variant: gepa
    components:
      agent: target
    max_cases: 10
    field_limit: 6000
    timeout_s: 600
  meta_agent:
    variant: gepa
    expose_gate_data: false
    runner: harbor
    agent: codex
    model: gpt-5.4
    environment: docker
    image: evolve-meta-agent-app:ubuntu-latest
    editable_roots: [target]
    components:
      agent: target
    component_strategy: all
    max_examples: 10
    max_retries: 1
    timeout_s: 7200
    agent_kwargs:
      reasoning_effort: xhigh
  validate:
    variant: minibatch_improvement
    criterion: strict
    n_concurrent: 25
    agent_setup_timeout_multiplier: 1
    agent_timeout_multiplier: 1
    max_retries: 1
    timeout_s: 43200
  gate: {variant: parent_eligible, timeout_s: 43200}
  record: {variant: gepa, timeout_s: 600}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: swe-bench-lite
  model: openai/gpt-5.4-2026-03-05
  agent: evolve_harbor_adapter:MiniSweSourceAgent
  candidate_runtime:
    variant: uv
    project: target
    python: "3.12"
  agent_env:
    OPENAI_BASE_URL: http://172.17.0.1:18788/v1
    OPENAI_API_BASE: http://172.17.0.1:18788/v1
    NO_PROXY: 172.17.0.1,127.0.0.1,localhost
    no_proxy: 172.17.0.1,127.0.0.1,localhost
    MINISWE_CONFIG: mini
    MINISWE_REASONING_EFFORT: high
    MINISWE_MAX_OUTPUT_LIMIT: "10000"
    MINISWE_STEP_LIMIT: "100"
    MINISWE_COST_LIMIT: "3.0"
    MINISWE_ENV_TIMEOUT: "30"
  split:
    train: 0.5617977528089888
    gate: 0.21348314606741572
    sealed: 0.2247191011235955
    seed: 0
  sampling: static
  tasks_per_round: 19
  anchor: {final: true, every_rounds: 0}
  k: 1
  n_concurrent: 25
  agent_setup_timeout_multiplier: 1
  agent_timeout_multiplier: 1
  max_retries: 1
  partial_floor: 0.8
