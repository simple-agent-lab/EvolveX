experiment:
  id: gepa
  max_generations: 20
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {variant: pareto, seed: 0, timeout_s: 600}
  rollout: {variant: harbor, budget_tasks: 10, task_sampling: generation_shuffle, n_concurrent: 4, agent_setup_timeout_multiplier: 1, max_retries: 1, timeout_s: 3600}
  analyze:
    variant: gepa
    components:
      system_prompt: target/prompt.md
      task_execution_skill: target/skills/task-execution
    max_cases: 10
    field_limit: 4000
    timeout_s: 600
  mutate:
    variant: gepa
    expose_gate_data: false
    runner: harbor
    agent: codex
    model: gpt-5.4
    environment: docker
    image: evolve-meta-agent-codex:20260805-codex0145
    editable_roots: [target]
    components:
      system_prompt: target/prompt.md
      task_execution_skill: target/skills/task-execution
    component_strategy: round_robin
    max_examples: 10
    max_retries: 1
    timeout_s: 3600
  validate: {variant: minibatch_improvement, criterion: strict, n_concurrent: 4, agent_setup_timeout_multiplier: 1, max_retries: 1, timeout_s: 3600}
  gate: {variant: parent_eligible, timeout_s: 600}
  record: {variant: gepa, timeout_s: 600}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: terminal-bench-2-30-v1
  agent: target.agent:HarborAgent
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 10
  anchor: {final: true, every_rounds: 0}
  repetitions: 1
  n_concurrent: 4
  agent_setup_timeout_multiplier: 1
  max_retries: 1
  partial_floor: 0.8
