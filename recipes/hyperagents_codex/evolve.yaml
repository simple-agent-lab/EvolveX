experiment:
  id: hyperagents_codex
  max_generations: 10
  target_score: null
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
    - operators/**
  exclude: []
operators:
  select: {variant: score_child_prop, seed: 0}
  rollout: {variant: evaluation_replay, field_limit: 2000, timeout_s: 600}
  trace_analyzer: {variant: trace_browser, max_chars: 30000, timeout_s: 600}
  meta_agent: {variant: hyperagents, runner: harbor, expose_gate_data: false, agent: codex, model: gpt-5.4, environment: docker, image: evolve-meta-agent-codex:20260805-codex0145, editable_roots: [target, operators], prompt_path: target/prompt.md, skills_dir: target/skills, memory_dir: target/memory, tools_dir: target/tools, agent_kwargs: {reasoning_effort: high}, max_retries: 1, timeout_s: 21600}
  validate: {variant: hyperagents, timeout_s: 300}
  gate: {variant: parent_eligible}
  record: {variant: hyperagents}
  timeout_s: 600
execution_runtime:
  backend: docker
  minimum_free_gib: 80
evaluator:
  engine: harbor
  model: gpt-5.4
  dataset: terminal-bench-2-10-10-10
  agent: target.agent:HarborAgent
  task_scope: full
  evaluation_split: train
  sampling: static
  tasks_per_round: 30
  repetitions: 1
  n_concurrent: 5
  agent_setup_timeout_multiplier: 1
  agent_timeout_multiplier: 1
  max_retries: 1
  benchmark_timeout_is_zero: true
  partial_floor: 0.8
