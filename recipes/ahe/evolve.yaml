  revision: 388da74aad620a384ab47669b17c52133e30e7c3
  generate_lock: true
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {variant: ahe_latest, timeout_s: 600}
  rollout: {variant: evaluation_replay, field_limit: 2000, timeout_s: 600}
  trace_analyzer: {variant: ahe, max_tasks: 30, max_concurrent: 10, timeout_per_task: 600, retry_attempts: 1, debugger_agent_kwargs: {reasoning_effort: high, max_tokens: 64000}, field_limit: 2000, timeout_s: 3600}
  meta_agent: {variant: ahe, runner: harbor, expose_gate_data: false, agent: evolve.integrations.harbor.miniswe_task_file:FileTaskMiniSweAgent, model: openai/gpt-5.4-2026-03-05, environment: docker, image: evolve-meta-agent-app:20260724-tools-mswe245, editable_roots: [target], prompt_path: target/src/minisweagent/config/mini.yaml, skills_dir: target/skills, memory_dir: target/memory, tools_dir: target/tools, agent_kwargs: {reasoning_effort: high, cost_limit: 0, max_tokens: 64000}, max_retries: 1, timeout_s: 3600}
