experiment:
  id: ahe
  max_generations: 8
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {variant: greedy, timeout_s: 600}
  rollout: {variant: harbor, evidence_profile: self_harness, budget_tasks: 1, n_concurrent: 4, agent_setup_timeout_multiplier: 3, max_retries: 1, timeout_s: 3600}
  mutate: {variant: agent_command, command: codex exec --full-auto - < "$EVOLVE_PROMPT_FILE", timeout_s: 3600}
  gate: {variant: hillclimb, timeout_s: 600}
  record: {variant: jsonl, timeout_s: 600}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: pass@k
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 1
  anchor: {final: true, every_rounds: 0}
  k: 1
  n_concurrent: 4
  agent_setup_timeout_multiplier: 3
  max_retries: 1
  partial_floor: 0.8
