  max_retries: 1
  benchmark_timeout_is_zero: true
  partial_floor: 0.8
  agent_env:
    MINISWE_STEP_LIMIT: "100"
    MINISWE_REASONING_EFFORT: "high"
    MINISWE_COST_LIMIT: "0"
    MINISWE_ENV_TIMEOUT: "30"
