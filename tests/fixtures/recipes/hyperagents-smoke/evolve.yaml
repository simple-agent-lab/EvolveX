experiment:
  id: hyperagents-smoke
  max_generations: 8
  target_score: null
  budget_usd: 1
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-dummy
surface:
  include:
    - target/**
    - operators/**
  exclude: []
operators:
  select: {operator: score_child_prop, config: {seed: 0}}
  rollout: {operator: noop, config: {}}
  mutate: {operator: hyperagents, timeout_s: 3600, config: {runner: local, editable_roots: [target, operators]}}
  validate: {operator: hyperagents, timeout_s: 300, config: {}}
  gate: {operator: parent_eligible, config: {}}
  record: {operator: hyperagents, config: {}}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: pass@k
  agent: target.agent:HarborAgent
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 8
  k: 1
  n_concurrent: 1
  max_retries: 0
  partial_floor: 0.9
